  <path d="M10 62h29c-2 9-25 9-29 0z" fill="url(#gold)"/>
  <circle cx="24.5" cy="56" r="6" fill="url(#ball)"/>
  <!-- right pan (heavy, low) -->
  <path d="M89 73h29c-2 9-25 9-29 0z" fill="url(#gold)"/>
  <circle cx="97" cy="67" r="6" fill="url(#ball)"/>
  <circle cx="110" cy="67" r="6" fill="url(#ball)"/>
