<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233b"/>
      <stop offset="1" stop-color="#0b1320"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dc8a"/>
      <stop offset="1" stop-color="#b08a22"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#7a5c12"/>
    </radialGradient>
  </defs>
  <rect x="8" y="12" width="112" height="108" rx="20" fill="#05090f" opacity="0.35"/>
  <rect x="8" y="8" width="112" height="108" rx="20" fill="url(#sky)"/>
  <circle cx="26" cy="24" r="1.4" fill="#F3E5AB"/>
  <circle cx="96" cy="20" r="1.3" fill="#F3E5AB" opacity="0.8"/>
  <circle cx="40" cy="44" r="0.9" fill="#F3E5AB" opacity="0.6"/>
  <!-- stand -->
  <rect x="61.5" y="30" width="5" height="68" fill="url(#gold)"/>
  <path d="M44 104l10-8h20l10 8z" fill="url(#gold)"/>
  <!-- beam, tipped to the heavy side -->
  <g transform="rotate(8 64 32)">
